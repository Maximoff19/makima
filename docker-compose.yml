name: makima
services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      MAKIMA_MODEL: ${MAKIMA_MODEL:-qwen2.5vl:7b-q4_K_M}
      # Prefill dominates latency on CPU-only hosts: these three cap it.
      MAKIMA_NUM_CTX: ${MAKIMA_NUM_CTX:-2048}
      MAKIMA_MAX_OUTPUT_TOKENS: ${MAKIMA_MAX_OUTPUT_TOKENS:-180}
      MAKIMA_NUM_THREAD: ${MAKIMA_NUM_THREAD:-6}
      # Terminal tool. Off unless enabled; when on, commands run in the read-only
      # sandbox service rather than inside the gateway.
      MAKIMA_ENABLE_TERMINAL: ${MAKIMA_ENABLE_TERMINAL:-1}
      MAKIMA_SANDBOX_URL: http://sandbox:8001
      # MCP servers as name=url[:token], comma separated. Empty disables MCP entirely.
      MAKIMA_MCP_SERVERS: ${MAKIMA_MCP_SERVERS:-}
      MAKIMA_TOOL_ROUNDS: ${MAKIMA_TOOL_ROUNDS:-3}
      # Text-only Fast mode, explicitly pinned to the requested quantization.
      MAKIMA_FAST_MODEL: ${MAKIMA_FAST_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      MAKIMA_TTS_VOICE: ${MAKIMA_TTS_VOICE:-ef_dora}
      MAKIMA_TTS_SPEED: ${MAKIMA_TTS_SPEED:-1.0}
      MAKIMA_VISION_MODEL: ${MAKIMA_VISION_MODEL:-qwen2.5vl:7b-q4_K_M}
    secrets: [makima_token, opencode_password]
    volumes:
      - ./config/system-prompt.txt:/config/system-prompt.txt:ro
      - ./config/user-profile.txt:/config/user-profile.txt:ro
      - ./data/history:/data/history
    depends_on: [ollama, whisper, kokoro, sandbox]
    networks: [private, coolify]
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.services.makima-gateway.loadbalancer.server.port=8000"
      - "traefik.http.routers.makima-http.rule=Host(`${MAKIMA_DOMAIN:?Set a domain before starting the stack}`)"
      - "traefik.http.routers.makima-http.entrypoints=http"
      - "traefik.http.routers.makima-http.middlewares=makima-redirect"
      - "traefik.http.routers.makima-http.service=makima-gateway"
      - "traefik.http.middlewares.makima-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.makima-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.makima-https.rule=Host(`${MAKIMA_DOMAIN:?Set a domain before starting the stack}`)"
      - "traefik.http.routers.makima-https.entrypoints=https"
      - "traefik.http.routers.makima-https.tls=true"
      - "traefik.http.routers.makima-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.makima-https.service=makima-gateway"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Evicting the 6.6 GB model costs ~60 s of disk read on the next message.
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    networks: [private]
    mem_limit: 23g
    cpus: 7

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [private]
    mem_limit: 512m

  # Static publishing for the makima agent. The same host directory is mounted read-write at the
  # agent's /workspace/site (see docker-compose.opencode.yml) and read-only here, so writing a
  # file IS publishing it. nginx is a separate service on purpose: published HTML never runs
  # inside the gateway process that holds the API token.
  #
  # Published on IP:port, not on a domain. No Traefik router, no certificate, no DNS: a project
  # at /workspace/site/proyecto-web is reachable at http://<vps-ip>:8085/proyecto-web/.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./data/web:/usr/share/nginx/html:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [private]
    mem_limit: 128m

  # Read-only inspection sandbox for the terminal tool. Private network only, no published
  # ports, and deliberately NO docker socket: that mount is the difference between
  # "the model can read the box" and "the model owns the box".
  sandbox:
    build:
      context: ./gateway
      dockerfile: sandbox.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      # Read-only host facts. Nothing writable, nothing sensitive.
      - ./data/sandbox:/host:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    networks: [private]

  engram:
    build: ./engram
    restart: unless-stopped
    volumes:
      - engram_data:/data
    # Engram 2.2.1 hardcodes its HTTP bind to 127.0.0.1, so it cannot live on its own network
    # namespace: it must share the gateway's. That reference breaks if the gateway is recreated,
    # so the healthcheck below is load-bearing: a failure makes Docker restart Engram, which
    # re-joins the gateway's current namespace and repairs the stack without human action.
    network_mode: "service:gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7437/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m

  whisper:
    build: ./whisper
    restart: unless-stopped
    volumes:
      - whisper_models:/models
    networks: [private]
    mem_limit: 4500m
    cpus: 4

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0
    restart: unless-stopped
    environment:
      API_LOG_LEVEL: WARNING
      ENABLE_DEBUG_ENDPOINTS: "false"
    networks: [private]
    mem_limit: 2g
    cpus: 3

networks:
  private:
  coolify:
    external: true

volumes:
  ollama_data:
  engram_data:
  whisper_models:

secrets:
  makima_token:
    file: ./config/makima_token
  # The gateway's makima-super route authenticates against the opencode service with this.
  # It existed on disk but was never declared, so every super request died on
  # FileNotFoundError opening /run/secrets/opencode_password.
  opencode_password:
    file: ./config/opencode_password
  # Read only by the opencode agent, for `npx vercel --token $(cat ...)`. Mounted as a file
  # rather than an env var so it does not show up in `docker inspect`. Be aware the agent also
  # has a shell: anything the model can read, the model can leak. Use a token you can rotate.
  vercel_token:
    file: ./config/vercel_token
