# Static publishing for the makima agent.
#
# The agent writes into the shared data/web directory and nginx serves the very same directory
# read-only, so "write the file" IS "publish the site": there is no build step, no deploy script
# and no shell on the host. This file is mounted in /etc/nginx/conf.d, so it lives inside the
# http context and must contain server blocks only.
#
# Validated with `nginx -t` on the VPS before the reload; a bad config must never reach the
# running container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # This server is published as IP:port (8085:80), not behind a domain. nginx would otherwise
    # build redirects from its own port 80 and point browsers at a port nothing listens on, so
    # emit relative Location headers and let the browser resolve them against the real origin.
    absolute_redirect off;

    # Never list a directory. A published site is addressed by its URL, not browsed.
    autoindex off;

    # A trailing-slash request for /proyecto-web resolves to the directory index, so the site is
    # reachable at its clean URL without naming index.html.
    try_files $uri $uri/ =404;

    # The publish root is writable by the agent, and nginx follows symlinks by default: without
    # this a symlink is how a page would reach the Engram SQLite store or the agent's own config
    # and put it on the public internet. Any symlink leaving the root is ignored.
    disable_symlinks if_not_owner from=$document_root;

    # add_header does not merge across blocks: a location that sets any header drops every header
    # inherited from the server block. That is why the security headers are repeated per location
    # instead of being set once above.
    location ~ /\. {
        # Dotfiles are never a published page. deny, not ignore: return 403 rather than fall
        # through to try_files and potentially serve something.
        deny all;
        access_log off;
    }

    location ~* \.html?$ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # No caching on HTML, or an edit the agent just made would keep serving the old page and
        # "write the file" would stop meaning "publish it".
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(css|js|mjs|json|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|mp4|webm|mp3|wav|pdf|txt|xml)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=3600" always;
    }
}